name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A literal prefix, not ${{ github.workflow }}: when release.yml calls this workflow,
# github.workflow is "Release", which would put this run in the caller's own
# (case-insensitive) concurrency group and deadlock the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 22, 24]
        include:
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node test/progress-heartbeat.mjs
        if: runner.os != 'Windows'

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-release.mjs
      - run: node scripts/pack.mjs --out dist
      - run: |
          unzip -t dist/agy-bridge.mcpb
          unzip -t dist/agy-bridge-dev.mcpb
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agy-bridge-bundles
          path: dist/
          retention-days: 14
          if-no-files-found: error
